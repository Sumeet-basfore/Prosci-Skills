name: factory

# The gate. It runs on GitHub, where a change to this repository cannot edit it.
# The check is named `factory`, and branch protection requires that name.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  factory:
    name: factory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Sumeet-basfore/prosci
          path: factory
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run the contract
        run: node factory/bin/verify . --state-dir .factory --json
      - name: L1 routing (deterministic, no model)
        run: |
          if [ -f eval/harness/routing.mjs ]; then node eval/harness/routing.mjs; else echo "no eval harness in this repo, skipping"; fi
      - name: L2 install (deterministic, no model)
        run: |
          if [ -f eval/harness/install.mjs ]; then node eval/harness/install.mjs; else echo "no eval harness in this repo, skipping"; fi
      - name: Skill fingerprint
        run: |
          if [ -f eval/harness/fingerprint.mjs ]; then node eval/harness/fingerprint.mjs --check; else echo "no fingerprint in this repo, skipping"; fi
      - name: Keep the receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-receipt
          path: .factory/verify.jsonl
          if-no-files-found: warn
