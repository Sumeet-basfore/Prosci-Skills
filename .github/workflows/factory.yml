name: factory

# The gate. It runs on GitHub, where a change to this repository cannot edit it.
# The check is named `factory`, and branch protection requires that name.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  factory:
    name: factory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Sumeet-basfore/prosci
          path: factory
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run the contract
        run: node factory/bin/verify . --state-dir .factory --json
      - name: Deterministic evaluation
        # Skips only for repos that carry no harness at all. If eval/harness exists, every layer must
        # exist and pass: a per-file guard hid a missing file once, and a skip is not a pass.
        run: |
          if [ ! -d eval/harness ]; then echo "no eval harness in this repo, skipping"; exit 0; fi
          node eval/harness/routing.mjs
          node eval/harness/install.mjs
          node eval/harness/fingerprint.mjs --check
          node eval/harness/validate-scenarios.mjs
          node eval/harness/validate-scenarios.mjs --layer calibrated
          # A directory argument is not supported before Node 24, so name the files.
          node --test eval/harness/test/*.test.mjs
      - name: Keep the receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-receipt
          path: .factory/verify.jsonl
          if-no-files-found: warn
